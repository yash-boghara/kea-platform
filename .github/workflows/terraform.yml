name: terraform

# Two tiers of check:
#
#   Offline  — policy unit tests and per-module `terraform validate`. No cloud
#              credentials, so these run on every push and PR from day one.
#   Cloud    — plan, policy gate against real plan JSON, and apply. These need
#              AWS, so they are gated on the AWS_ENABLED repository variable.
#
# The gate exists so the repo is not permanently red before AWS is wired up. A
# portfolio repo with failing CI reads worse than one with fewer checks.
# Enable with:  gh variable set AWS_ENABLED --body true

on:
  pull_request:
    paths: ['terraform/**', 'policies/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['terraform/**', 'policies/**', '.github/workflows/terraform.yml']

permissions:
  contents: read

env:
  TF_DIR: terraform/envs/platform
  AWS_REGION: ap-southeast-2
  TF_VERSION: 1.15.8
  CONFTEST_VERSION: 0.69.0

jobs:
  # --- Offline -----------------------------------------------------------

  policy-test:
    name: policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed from the release archive rather than a third-party setup
      # action, with the checksum verified. One less action to trust in a repo
      # whose whole point is supply-chain controls.
      - name: install conftest
        run: |
          set -euo pipefail
          BASE="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -sSfL -o conftest.tar.gz "${BASE}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o checksums.txt "${BASE}/checksums.txt"
          grep "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" checksums.txt \
            | sed 's|conftest_|./conftest_|' > expected.txt
          cp conftest.tar.gz "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sha256sum -c expected.txt
          mkdir -p "$HOME/.local/bin"
          tar -xzf conftest.tar.gz -C "$HOME/.local/bin" conftest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: conftest version
        run: conftest --version

      # The policies guard the infrastructure; these guard the policies. They
      # caught a fail-open bug where an absent attribute silently bypassed the
      # encryption check, which is the whole argument for testing policy.
      - name: policy unit tests
        run: conftest verify -p policies/

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      # Each module is validated on its own with -backend=false, so no state
      # bucket and no credentials are required. The root stack is deliberately
      # not validated yet: it references modules that are still stubs, so it
      # would fail for reasons that are expected rather than informative.
      - name: validate modules
        run: |
          set -euo pipefail
          failed=0
          for dir in terraform/modules/*/; do
            if [ ! -s "${dir}main.tf" ]; then
              echo "::notice::skipping ${dir} (not implemented yet)"
              continue
            fi
            echo "::group::${dir}"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: tflint
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/; do
            [ -s "${dir}main.tf" ] || continue
            echo "::group::${dir}"
            tflint --chdir="$dir" --format=compact
            echo "::endgroup::"
          done

  # --- Cloud -------------------------------------------------------------

  plan:
    name: plan and policy gate
    runs-on: ubuntu-latest
    needs: [policy-test, validate]
    if: vars.AWS_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> AWS. No long-lived keys anywhere.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: install conftest
        run: |
          set -euo pipefail
          BASE="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          curl -sSfL "${BASE}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin conftest

      - name: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false -no-color
          terraform show -json tfplan > tfplan.json

      # The gate. Table output because a policy engine that only says "denied"
      # gets disabled within a month.
      - name: policy gate
        working-directory: ${{ env.TF_DIR }}
        run: |
          conftest test tfplan.json \
            --policy ../../../policies/terraform \
            --all-namespaces \
            --output table

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 5

  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: plan
    if: vars.AWS_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production # add a required reviewer on this in repo settings
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
